aid: cleanslate
name: CleanSlate
description: 'CleanSlate (CleanSlate Centers) is a national outpatient medical group
  treating opioid and alcohol use disorder with physician-led, office-based medication-assisted
  treatment — FDA-approved medication combined with primary care and behavioral health
  therapy for polysubstance use and co-occurring disorders. Founded in 2009 in Massachusetts
  by Dr. Amanda Wilson in response to the opioid epidemic, it grew to more than 65 outpatient
  centers across eight states and raised roughly $79M in venture backing before being acquired
  by Spero Health on July 1, 2026. CleanSlate is a care-delivery organization: it operates
  clinics, not a software platform, and publishes no public API, SDK, developer portal or
  machine-readable specification.'
